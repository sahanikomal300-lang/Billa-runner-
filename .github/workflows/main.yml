name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Check Project
        run: |
          echo "📁 Project files:"
          ls -la
          echo "📁 App folder:"
          ls -la app

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --info

      - name: Show APK
        if: always()
        run: |
          echo "📦 Searching APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Billa-runner-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "## 📦 Billa Runner APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gradle:** 9.3.1" >> "$GITHUB_STEP_SUMMARY"
          echo "- **JDK:** 17" >> "$GITHUB_STEP_SUMMARY"
